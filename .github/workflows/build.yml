name: Pre-release Build
on: workflow_dispatch
jobs:
  Build-Linux:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: cargo build
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: Pre-release
          prerelease: true
          overwrite_files: true
          files: target/debug/diffcsv
